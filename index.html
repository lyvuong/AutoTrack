<!doctype html>
<html lang="en" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AutoTrack - Vehicle Maintenance & Repair Log PWA</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Track car maintenance, repair records, fuel logs, service history, and costs offline or synced with Firebase." />
    <meta name="theme-color" content="#0284c7" />

    <!-- PWA & Mobile Web App Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AutoTrack" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="h-full bg-slate-950 text-slate-100 antialiased font-sans selection:bg-cyan-500 selection:text-white overflow-x-hidden">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PWA] Service Worker registered:', reg.scope))
            .catch(err => console.log('[PWA] Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
