<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Light Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Vibrant Primary Cyan/Blue Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gauge Track Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Light Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.4" />
    </linearGradient>

    <!-- Car Body Light Gradient -->
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Light Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Outer Minimal Track Arc / Gauge Ring -->
  <path d="M 120 340 A 180 180 0 1 1 392 340" 
        stroke="url(#trackGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        opacity="0.25" />

  <path d="M 140 330 A 160 160 0 1 1 372 330" 
        stroke="url(#trackGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        filter="url(#glow)"
        opacity="0.9"
        stroke-dasharray="380 120" />

  <!-- Minimalist Sleek Car Silhouette -->
  <!-- Roof, Windshield & Fastback Contour -->
  <path d="M 140 310 L 175 220 C 182 202 198 190 218 190 H 294 C 314 190 330 202 337 220 L 372 310" 
        stroke="url(#cyanBlue)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Car Body Base & Aerodynamic Wing -->
  <path d="M 115 310 H 397 C 415 310 426 322 426 336 V 344 C 426 354 418 362 408 362 H 380 C 372 362 364 354 364 344 C 364 334 356 326 346 326 H 166 C 156 326 148 334 148 344 C 148 354 140 362 132 362 H 104 C 94 362 86 354 86 344 V 336 C 86 322 97 310 115 310 Z" 
        fill="url(#carGrad)" 
        stroke="url(#cyanBlue)" 
        stroke-width="16" 
        stroke-linejoin="round" />

  <!-- Minimalist Glowing Wheel Hubs -->
  <circle cx="152" cy="346" r="24" fill="#0284c7" stroke="#38bdf8" stroke-width="8" />
  <circle cx="152" cy="346" r="8" fill="#ffffff" />

  <circle cx="360" cy="346" r="24" fill="#0284c7" stroke="#38bdf8" stroke-width="8" />
  <circle cx="360" cy="346" r="8" fill="#ffffff" />

  <!-- Dynamic Service Tracking Check / Speed Line -->
  <path d="M 210 262 L 245 292 L 310 220" 
        stroke="#0284c7" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>
